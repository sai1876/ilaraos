<html lang="en"><head>

                        "background": "#fdf8f6",

                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed-dim": "#c8c6c2",
                        "primary": "#506600",
                        "surface-variant": "#e6e2df",
                        "surface-container-low": "#f7f3f0",
                        "on-surface": "#1c1b1a",
                        "primary-container": "#ccff00",
                        "on-background": "#1c1b1a",

                        "secondary-fixed": "#e5e2e1",

                        "tertiary": "#5e5e5b",
                        "inverse-on-surface": "#f4f0ed",
                        "on-tertiary-fixed-variant": "#474744",
                        "outline": "#747a60",
                        "on-secondary-fixed-variant": "#474746",
                        "outline-variant": "#c4c9ac",
                        "surface": "#fdf8f6",

                        "on-primary-container": "#5b7300",
                        "surface-container": "#f1edea",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#3c4d00",
                        "tertiary-container": "#efede8",
                        "surface-dim": "#ddd9d6",
                        "on-tertiary-container": "#6b6b67",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#e4e2dd",
                        "surface-bright": "#fdf8f6",
                        "inverse-surface": "#31302e",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#c3f400",
                        "inverse-primary": "#abd600"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {

                        "container-padding-mobile": "20px",
                        "base": "8px",

                    },

                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }]

                }
            }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen pb-[100px]">
<!-- Top App Bar (Transactional - Simplified for Payment) -->
<header class="sticky top-0 w-full z-50 flex justify-between items-center px-container-padding-mobile md:px-container-padding-desktop h-16 bg-background border-b border-on-surface/10">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile font-bold flex-1 text-center truncate px-4">Complete Payment</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="px-container-padding-mobile pt-6 pb-24 max-w-lg mx-auto">
<!-- Countdown Timer Banner -->
<div class="bg-primary-container text-on-primary-container rounded-lg p-4 mb-8 flex items-center justify-center space-x-3 shadow-sm border border-primary-container/20">
<span class="material-symbols-outlined" data-weight="fill">timer</span>
<p class="font-label-bold text-label-bold">Slot reserved for <span class="font-bold" id="countdown">04:59</span></p>
</div>
<!-- Booking Summary Minimal -->
<section class="mb-8 bg-surface-container-low rounded-xl p-5 border border-on-surface/5">
<div class="flex items-start justify-between mb-2">
<div>
<h2 class="font-body-md text-body-md font-bold mb-1">Central Turf Ground 1</h2>
<p class="font-label-sm text-label-sm text-secondary">Tomorrow, 18:00 - 19:30 (90 mins)</p>
</div>
</div>
</section>
<!-- Payment Methods -->
<section class="mb-8">
<h3 class="font-body-lg text-body-lg font-bold mb-4">Payment Method</h3>
<div class="space-y-3">
<!-- UPI Option -->
<label class="flex items-center p-4 border border-on-surface/10 rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors relative">
<input checked="" class="form-radio text-primary focus:ring-primary border-on-surface/20 w-5 h-5 mr-4" name="payment_method" type="radio" value="upi"/>
<div class="flex-1 flex items-center justify-between">
<span class="font-body-md text-body-md font-medium">UPI (Google Pay, PhonePe)</span>
<span class="material-symbols-outlined text-secondary" data-weight="fill">qr_code_scanner</span>
</div>
<!-- Selected State Outline -->
<div class="absolute inset-0 border-2 border-primary rounded-lg pointer-events-none"></div>
</label>
<!-- Card Option -->
<label class="flex items-center p-4 border border-on-surface/10 rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio text-primary focus:ring-primary border-on-surface/20 w-5 h-5 mr-4" name="payment_method" type="radio" value="card"/>
<div class="flex-1 flex items-center justify-between">
<span class="font-body-md text-body-md font-medium">Credit / Debit Card</span>
<span class="material-symbols-outlined text-secondary" data-weight="fill">credit_card</span>
</div>
</label>
<!-- Ilara Credits Option -->
<label class="flex items-center p-4 border border-on-surface/10 rounded-lg bg-surface-container-lowest cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio text-primary focus:ring-primary border-on-surface/20 w-5 h-5 mr-4" name="payment_method" type="radio" value="credits"/>
<div class="flex-1 flex items-center justify-between">
<div>
<span class="font-body-md text-body-md font-medium block">Ilara Credits</span>
<span class="font-label-sm text-label-sm text-secondary block mt-0.5">Balance: ₹120</span>
</div>
<span class="material-symbols-outlined text-secondary" data-weight="fill">toll</span>
</div>
</label>
</div>
</section>
<!-- Price Breakdown -->
<section class="mb-8">
<h3 class="font-body-lg text-body-lg font-bold mb-4">Price Breakdown</h3>
<div class="bg-surface-container-lowest border border-on-surface/10 rounded-xl p-5 space-y-3">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-secondary">Ground Fee</span>
<span class="font-body-md text-body-md font-medium">₹800</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-secondary">Platform Fee</span>
<span class="font-body-md text-body-md font-medium">₹20</span>
</div>
<div class="flex justify-between items-center pb-3 border-b border-on-surface/10">
<span class="font-body-md text-body-md text-secondary">Taxes</span>
<span class="font-body-md text-body-md font-medium">₹15</span>
</div>
<div class="flex justify-between items-center pt-2">
<span class="font-body-md text-body-md font-bold">Total Amount</span>
<span class="font-headline-sm-mobile text-headline-sm-mobile font-bold text-primary">₹835</span>
</div>
</div>
<div class="mt-4 flex items-center justify-center space-x-1 text-secondary opacity-80">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-sm text-label-sm">Secure Payment Processing</span>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t border-on-surface/10 p-4 pb-safe z-50">
<button class="w-full bg-primary-container text-on-surface font-body-md text-body-md font-bold rounded-full py-4 px-6 flex justify-center items-center scale-down duration-200 active:scale-95 shadow-md">
            Pay and Confirm Booking
        </button>
</div>
<!-- Script for simple timer countdown -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            let timeLeft = 4 * 60 + 59; // 4:59 in seconds
            const timerDisplay = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timer);
                    timerDisplay.textContent = "00:00";
                    timerDisplay.classList.add('text-error');
                    // Typically would redirect or show expiration state here
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);

            // Simple radio button selection logic to show border
            const radioButtons = document.querySelectorAll('input[name="payment_method"]');
            radioButtons.forEach(radio => {
                radio.addEventListener('change', function() {
                    // Remove borders from all
                    document.querySelectorAll('label > div.absolute').forEach(div => {
                        div.remove();
                    });
                    
                    // Add border to selected
                    if(this.checked) {
                        const outlineDiv = document.createElement('div');
                        outlineDiv.className = 'absolute inset-0 border-2 border-primary rounded-lg pointer-events-none';
                        this.closest('label').appendChild(outlineDiv);
                    }
                });
            });
        });
    </script>
</body></html>
