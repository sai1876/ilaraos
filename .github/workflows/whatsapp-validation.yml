name: WhatsApp Repair Validation

on:
  push:
    branches:
      - fix/whatsapp-end-to-end
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/server/whatsapp/client.test.ts src/server/whatsapp/verifyWebhookSignature.test.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
